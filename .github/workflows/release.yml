name: Release VoiceFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose unsigned distribution or signed production release'
        required: true
        type: choice
        default: unsigned
        options:
          - unsigned
          - checks
          - production-release
      version:
        description: 'Version for manual runs, for example 1.0.0 (optional)'
        required: false
        type: string

permissions:
  contents: write

env:
  DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'unsigned' }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Resolve version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "Expected a version tag such as v1.0.0; received: $TAG" >&2
              exit 1
            }
            VERSION="${TAG#v}"
          else
            VERSION="${MANUAL_VERSION:-0.0.0-manual.${GITHUB_RUN_NUMBER}}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
              echo "Expected a version such as 1.0.0; received: $VERSION" >&2
              exit 1
            }
            TAG="unsigned-v${VERSION}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"

      - name: Install Developer ID certificate in temporary keychain
        if: env.RELEASE_MODE == 'production-release'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?Missing DEVELOPER_CERTIFICATE_P12_BASE64 secret}"
          : "${CERTIFICATE_PASSWORD:?Missing DEVELOPER_CERTIFICATE_PASSWORD secret}"
          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD secret}"
          KEYCHAIN_PATH="$RUNNER_TEMP/voiceflow-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Prepare App Store Connect API key
        if: env.RELEASE_MODE == 'production-release'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64 secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID secret}"
          : "${APPLE_ISSUER_ID:?Missing APPLE_ISSUER_ID secret}"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Run XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project voiceflow.xcodeproj \
            -scheme voiceflow \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/voiceflow-tests" \
            -destination 'platform=macOS' \
            ONLY_ACTIVE_ARCH=YES \
            -only-testing:voiceflowTests \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned DMG
        if: env.RELEASE_MODE == 'unsigned'
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/release.sh --unsigned "${{ steps.version.outputs.version }}"

      - name: Build unsigned Release app for manual checks
        if: env.RELEASE_MODE == 'checks'
        shell: bash
        env:
          MANUAL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/voiceflow-unsigned-release"
          xcodebuild \
            -project voiceflow.xcodeproj \
            -scheme voiceflow \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$MANUAL_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP="$DERIVED_DATA/Build/Products/Release/VoiceFlow.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'dha-aa.voiceflow'
          echo "Unsigned Release validation completed for VoiceFlow.app"

      - name: Run signed release preflight
        if: env.RELEASE_MODE == 'production-release'
        shell: bash
        run: ./scripts/release.sh --check

      - name: Build signed, notarized DMG
        if: env.RELEASE_MODE == 'production-release'
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Upload unsigned DMG
        if: env.RELEASE_MODE == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-${{ steps.version.outputs.version }}-unsigned
          if-no-files-found: error
          path: |
            dist/VoiceFlow-${{ steps.version.outputs.version }}.dmg
            dist/SHA256SUMS.txt

      - name: Upload verified signed artifacts
        if: env.RELEASE_MODE == 'production-release'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            dist/VoiceFlow-${{ steps.version.outputs.version }}.dmg
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: env.RELEASE_MODE == 'unsigned' || env.RELEASE_MODE == 'production-release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            RELEASE_TAG="${{ steps.version.outputs.tag }}"
            RELEASE_TITLE="VoiceFlow ${{ steps.version.outputs.version }}"
            VERIFY_ARGS=(--verify-tag)
          elif [[ "${RELEASE_MODE}" == "unsigned" ]]; then
            RELEASE_TAG="unsigned-v${{ steps.version.outputs.version }}-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="VoiceFlow ${{ steps.version.outputs.version }} (unsigned)"
            VERIFY_ARGS=()
          else
            RELEASE_TAG="production-v${{ steps.version.outputs.version }}-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="VoiceFlow ${{ steps.version.outputs.version }}"
            VERIFY_ARGS=()
          fi
          gh release create "$RELEASE_TAG" \
            "dist/VoiceFlow-${{ steps.version.outputs.version }}.dmg" \
            dist/SHA256SUMS.txt \
            "${VERIFY_ARGS[@]}" \
            --generate-notes \
            --title "$RELEASE_TITLE"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set +e
          KEYCHAIN_PATH="$RUNNER_TEMP/voiceflow-signing.keychain-db"
          if [[ -n "${KEYCHAIN_PASSWORD:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" "$RUNNER_TEMP/developer-id.p12"
